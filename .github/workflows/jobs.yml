name: Jobs  Test

on:
  # this is  for sequintial workflow
  workflow_run:
    workflows: [First Workflow]
    types:
      - completed
  # push:
  # workflow_dispatch:

jobs:
  validate-html:
    if: ${{github.event.workflow_run.conclusion == 'success'}}
    runs-on: ubuntu-latest
    steps:
      - name: Get repo code
        uses: actions/checkout@v4

      - name: Validate HTML file
        run: test -f index.html

  validate-js:
    if: ${{github.event.workflow_run.conclusion == 'success'}}

    runs-on: ubuntu-latest
    steps:
      - name: Get repo code
        uses: actions/checkout@v4

      - name: Validate JS file
        run: test -f scrip.js

  validate-code:
    if: ${{github.event.workflow_run.conclusion == 'success'}}

    # this is  for sequintial jobs
    needs: [validate-html, validate-js]
    runs-on: ubuntu-latest
    steps:
      - name: Get repo code
        uses: actions/checkout@v4

      - name: Validate Html code
        run: npx htmlhint inndex.html

      - name: Validate JS code
        run: node --check scrip.js
